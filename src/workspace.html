<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agency Workspace</title>
<meta name="description" content="A workspace you arrange yourself — open the tools you need, move them where you want them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Zilla+Slab:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/course.css">
</head>
<body>

<div class="sticky-head">
  <div class="topbar" data-topbar></div>
</div>

<div class="ws-bar">
  <div class="ws-bar-in">
    <button class="ws-add" id="drawerToggle" type="button" aria-expanded="false">
      <span class="plus">+</span> Add a tool
    </button>
    <span class="ws-who" id="wsWho"></span>
    <span class="ws-presets">
      <button type="button" data-preset="reporting">Reporting season</button>
      <button type="button" data-preset="grants">Grant deadline</button>
      <button type="button" data-preset="governance">Governance</button>
      <button type="button" id="clearAll" class="ws-clear">Clear</button>
    </span>
  </div>
</div>

<div class="ws-stage">
  <aside class="ws-drawer" id="drawer" aria-label="Tool drawer"></aside>
  <div class="ws-canvas" id="canvas"></div>
</div>

<script src="assets/config.js"></script>
<script src="assets/mode.js"></script>
<script src="assets/draft-banner.js"></script>
<script src="assets/profile.js"></script>
<script src="assets/interactions.js"></script>
<script src="assets/course.js"></script>
<script src="assets/dashboard.js"></script>
<script src="assets/feedback.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (window.Tailor && Tailor.isSetUp()) {
    document.getElementById("wsWho").textContent = Tailor.profile.org.name;
  }
});
</script>
</body>
</html>
